[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepwise-gait"
version = "0.2.0"
description = "Typed gait-analysis pipeline and asynchronous API prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "python-multipart>=0.0.9,<1",
  "numpy>=1.26,<2.4",
  "pandas>=2.1,<3",
  "pyarrow>=14,<26",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.10,<2",
  "pandas-stubs>=2.1,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
stepwise = "stepwise.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = '-ra -m "not large_equivalence"'
testpaths = ["tests"]
markers = [
  "large_equivalence: local-only 360,000-sample correctness-oracle comparison",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["stepwise"]

[tool.coverage.report]
fail_under = 80
show_missing = true
