name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/stepwise
      - name: Python tests and coverage
        run: pytest --cov=stepwise --cov-report=term-missing
      - name: Mini Program state-machine tests
        run: node --test tests/js/*.test.js

  dependency-bounds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - boundary: lowest
            numpy_spec: "numpy==1.26.0"
            pandas_spec: "pandas==2.1.0"
            pyarrow_spec: "pyarrow==14.0.0"
          - boundary: highest
            numpy_spec: "numpy>=1.26,<2.4"
            pandas_spec: "pandas>=2.1,<3"
            pyarrow_spec: "pyarrow>=14,<26"
    name: dependency-bounds (${{ matrix.boundary }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependency boundary
        run: >-
          python -m pip install -e ".[dev]"
          "${{ matrix.numpy_spec }}"
          "${{ matrix.pandas_spec }}"
          "${{ matrix.pyarrow_spec }}"
      - name: Report resolved versions
        run: >-
          python -c "import platform, numpy, pandas, pyarrow;
          print('python=' + platform.python_version());
          print('numpy=' + numpy.__version__);
          print('pandas=' + pandas.__version__);
          print('pyarrow=' + pyarrow.__version__)"
      - name: Python tests and coverage
        run: pytest --cov=stepwise --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root API image
        run: docker build --tag stepwise-api:test .
      - name: Run API container
        run: |
          docker run --detach --name stepwise-ci --publish 8080:8080 stepwise-api:test
          docker cp tests/fixtures/minimal_walk.txt stepwise-ci:/tmp/minimal_walk.txt
      - name: Smoke-test health, analysis, result, and artifact download
        run: >-
          docker exec stepwise-ci python -m stepwise.ci_smoke
          --base-url http://127.0.0.1:8080
          --walking /tmp/minimal_walk.txt
          --timeout-seconds 60
      - name: Container logs
        if: always()
        run: docker logs stepwise-ci
      - name: Remove API container
        if: always()
        run: docker rm --force stepwise-ci
